# Cas du benchmark de l'agent : le premier outil choisi par le LLM (rien n'est exécuté).
#
# Les cas sont rangés par catégorie. Pour chaque cas :
#   say     : phrase de l'utilisateur
#   tool    : premier outil attendu, ou liste d'outils acceptables ; « none » = aucun outil
#             (réponse directe, ou refus pour les interdits)
#   app     : application attendue après résolution par le catalogue (alias de config.yaml, menu Démarrer)
#   args    : {paramètre: [exigences]} ; chaque exigence est un mot qui doit apparaître dans la valeur,
#             ou une liste de mots dont un seul suffit (accents et majuscules ignorés)
#   history : tours précédents, chacun {user, calls: [[outil, arguments, résultat], ...], reply}
#   window  : fenêtre au premier plan simulée, « processus|titre » (sinon aucune)
#   answer  : si le modèle répond sans outil, mots que sa réponse doit contenir
# Mémoire simulée pendant le benchmark : prénom = Dan, anniversaire de maman = 12 mars (bench/run.py).

