        calls: [[open_app, {name: discord}, "J'ouvre Discord."]]
        reply: "J'ouvre Discord."
    tool: close_app
    args: {name: [discord]}
  - say: "lance le premier"
    history:
      - user: "à quoi j'ai le plus joué ?"
        calls: [[steam_library, {}, "14 jeux installés.\nLes plus joués : Rocket League (269 h), Palworld (247 h), Brawlhalla (204 h)."]]
        reply: "Tu as surtout joué à Rocket League, Palworld et Brawlhalla."
    tool: steam_launch
    args: {game: [rocket]}
  - say: "en fait c'est 5678"
    history:
      - user: "retiens que mon code wifi est 1234"
        calls: [[remember, {key: code wifi, value: "1234"}, "C'est noté : code wifi = 1234."]]
        reply: "C'est noté : code wifi = 1234."
    tool: remember
    args: {value: ["5678"]}
  - say: "et à Paris ?"
    history:
      - user: "quel temps fait-il à Nice ?"
        calls: [[web_search, {query: météo Nice}, "Résultats pour « météo Nice » :\n- Météo Nice : 18 °C, ensoleillé"]]
        reply: "Il fait 18 degrés et beau à Nice."
    tool: web_search
    args: {query: [paris]}
  - say: "plus fort"
    history:
      - user: "mets de la musique"
        calls: [[media, {command: play_pause}, "Lecture ou pause."]]
        reply: "Lecture ou pause."
    tool: volume
    args: {level: [up]}
  - say: "et ferme discord aussi"
    history:
      - user: "ferme spotify"
        calls: [[close_app, {name: spotify}, "J'ai fermé spotify."]]
        reply: "J'ai fermé spotify."
    tool: close_app
    args: {name: [discord]}
  - say: "lance la deuxième vidéo"
    history:
      - user: "cherche skyyart sur youtube"
        calls: [[browser_search, {query: skyyart, site: youtube}, "Je cherche « skyyart » sur Youtube."]]
        reply: "Je cherche « skyyart » sur YouTube."
    tool: youtube_play
    args: {query: [skyyart], rank: ["2"]}
  - say: "tu ne l'as pas ouverte"
    history:
      - user: "ouvre ma bibliothèque steam"
        calls: [[steam_library, {}, "14 jeux installés.\nLes plus joués : Rocket League (269 h), Palworld (247 h)."]]
        reply: "Ta bibliothèque Steam comporte 14 jeux."
    tool: steam_open

